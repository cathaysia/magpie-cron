<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Cron Scheduler</title>
  <style>
    :root {
      --bg: var(--magpie-bg, #1a1a1a);
      --fg: var(--magpie-fg, #e0e0e0);
      --fg-muted: var(--magpie-fg-muted, #888);
      --card-bg: var(--magpie-card-bg, rgba(255, 255, 255, 0.04));
      --border: var(--magpie-border, rgba(255, 255, 255, 0.12));
      --input-bg: var(--magpie-input-bg, rgba(0, 0, 0, 0.25));
      --accent: var(--magpie-accent, #3b82f6);
      --accent-hover: var(--magpie-accent-hover, #2563eb);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: transparent;
      width: 100%;
      min-height: 100%;
    }

    .container {
      width: 100%;
      max-width: 100%;
      padding: 16px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-text h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-text p {
      margin: 0;
      font-size: 12px;
      color: var(--fg-muted);
      line-height: 1.4;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--fg-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 7px 10px;
      font-size: 12.5px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .input-hint {
      font-size: 11px;
      color: var(--fg-muted);
      margin-top: 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: rgba(125, 125, 125, 0.15);
      border-color: var(--border);
      color: var(--fg);
    }
    .btn-secondary:hover {
      background: rgba(125, 125, 125, 0.25);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 11px;
    }

    .rules-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(125, 125, 125, 0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: background-color 0.15s ease;
    }

    .rule-item:hover {
      background: rgba(125, 125, 125, 0.08);
    }

    .rule-item.disabled {
      opacity: 0.6;
    }

    .rule-main {
      flex: 1;
      min-width: 0;
    }

    .rule-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .rule-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
    }

    .badge-active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-disabled {
      background: rgba(125, 125, 125, 0.2);
      color: var(--fg-muted);
    }

    .rule-details {
      font-size: 12px;
      color: var(--fg-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .rule-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(125, 125, 125, 0.12);
      color: var(--fg);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--fg-muted);
      font-size: 13px;
    }

    .code-view {
      margin-top: 12px;
      display: none;
    }

    .code-view textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      min-height: 120px;
      resize: vertical;
      line-height: 1.4;
    }

    .quick-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-text">
        <h3>⏰ 定时限制模型规则 (Cron Scheduler)</h3>
        <p>配置指定时间段对模型/Provider的阻断或禁用规则（如 DeepSeek 峰时限制、夜间配额控制等）。</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" id="btn-toggle-json">JSON 编辑</button>
        <button class="btn btn-primary btn-sm" id="btn-new">+ 添加规则</button>
      </div>
    </div>

    <!-- JSON 直接编辑面板 -->
    <div id="json-editor-card" class="card code-view">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <label>规则配置 JSON</label>
        <button class="btn btn-primary btn-sm" id="btn-save-json">应用 JSON</button>
      </div>
      <textarea id="json-textarea" spellcheck="false" placeholder="输入 rules JSON..."></textarea>
    </div>

    <!-- 添加 / 编辑表单 -->
    <div id="rule-form" class="card" style="display: none;">
      <div style="font-weight: 600; font-size: 13.5px; margin-bottom: 12px;" id="form-title">添加规则</div>
      
      <div class="form-grid">
        <div class="form-group full-width">
          <label>规则名称</label>
          <input type="text" id="rule-name" placeholder="例如：DeepSeek 峰时限制 (上午 9:00-12:00)">
        </div>

        <div class="form-group">
          <label>Provider ID</label>
          <input type="text" id="rule-provider" placeholder="* (全部) 或 remote-magpie, zcode">
          <div class="input-hint">填 <code>*</code> 表示匹配全部 provider</div>
        </div>

        <div class="form-group">
          <label>模型匹配 (Model ID)</label>
          <input type="text" id="rule-model" placeholder="例如：*deepseek* 或留空匹配全部">
          <div class="input-hint">支持通配符，如 <code>*deepseek*</code></div>
        </div>

        <div class="form-group">
          <label>Cron 表达式 (5位: 分 时 日 月 周)</label>
          <input type="text" id="rule-cron" placeholder="0 9 * * 1-5 (周一至周五 9:00)">
          <div class="input-hint">如：<code>0 9 * * 1-5</code>，<code>0 14 * * 1-5</code></div>
        </div>

        <div class="form-group">
          <label>生效窗口时长 (分钟)</label>
          <input type="number" id="rule-duration" placeholder="例如：180 (3小时)">
          <div class="input-hint">从 cron 触发起持续阻断的分钟数</div>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-secondary" id="btn-cancel">取消</button>
        <button class="btn btn-primary" id="btn-save">保存规则</button>
      </div>
    </div>

    <!-- 规则列表 -->
    <div class="card" style="padding: 12px;">
      <div id="rule-list" class="rules-list">
        <div class="empty-state">正在加载规则...</div>
      </div>
    </div>
  </div>

  <script src="/_magpie/bridge.js" onerror="window.__bridge_failed=true;"></script>
  <script src="app.js"></script>
</body>
</html>
