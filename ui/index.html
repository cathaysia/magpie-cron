<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Model Cron Scheduler</title>
  <style>
    body {
      font-family: inherit;
      color: var(--magpie-fg, #333);
      background: transparent;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 15px;
    }
    p.desc {
      color: var(--magpie-fg-muted, #666);
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .card {
      background: var(--magpie-card-bg, rgba(125, 125, 125, 0.08));
      border: 1px solid var(--magpie-border, rgba(125, 125, 125, 0.2));
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--magpie-fg-muted, #777);
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--magpie-border, #ccc);
      border-radius: 6px;
      background: var(--magpie-input-bg, #fff);
      color: var(--magpie-fg, #222);
    }
    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-primary {
      background: var(--magpie-accent, #3b82f6);
      color: #fff;
    }
    .btn-danger {
      background: #ef4444;
      color: #fff;
    }
    .btn-secondary {
      background: var(--magpie-btn-secondary-bg, rgba(125,125,125,0.15));
      color: var(--magpie-fg, #333);
    }
    .rule-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--magpie-border, rgba(125,125,125,0.1));
    }
    .rule-item:last-child {
      border-bottom: none;
    }
    .rule-info {
      flex: 1;
    }
    .rule-title {
      font-weight: 600;
      font-size: 13px;
    }
    .rule-meta {
      font-size: 12px;
      color: var(--magpie-fg-muted, #777);
      margin-top: 2px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      background: rgba(125,125,125,0.15);
      margin-left: 6px;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
  </style>
</head>
<body>
  <h3>Model Cron Scheduler (定时禁用模型计划)</h3>
  <p class="desc">Configure cron schedules to automatically disable or reject models under specific providers during chosen hours.</p>

  <div id="rule-form" class="card" style="display: none;">
    <h4 id="form-title" style="margin-top: 0; margin-bottom: 10px;">Add Schedule Rule</h4>
    <div class="form-group">
      <label>Rule Name</label>
      <input type="text" id="rule-name" placeholder="e.g. Nightly Disable Expensive Model">
    </div>
    <div class="form-group">
      <label>Provider ID (or * for all providers)</label>
      <input type="text" id="rule-provider" placeholder="e.g. remote-magpie, zcode, workbuddy-ai">
    </div>
    <div class="form-group">
      <label>Model ID (leave blank or * to disable all models under provider)</label>
      <input type="text" id="rule-model" placeholder="e.g. coderelay/claude-sonnet-4-6">
    </div>
    <div class="form-group">
      <label>Cron Expression (5 fields: min hour dom month dow)</label>
      <input type="text" id="rule-cron" placeholder="0 22 * * * (Every night at 10 PM)">
    </div>
    <div class="form-group">
      <label>Auto-Revert Duration (Minutes, e.g. 480 for 8h blackout)</label>
      <input type="number" id="rule-duration" placeholder="e.g. 480">
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-primary" id="btn-save">Save Rule</button>
      <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
    </div>
  </div>

  <div style="margin-bottom: 12px;">
    <button class="btn btn-primary" id="btn-new">+ Add Schedule Rule</button>
  </div>

  <div class="card">
    <div id="rule-list">
      <p style="font-size: 12px; color: var(--magpie-fg-muted, #777); margin: 0;">Loading rules...</p>
    </div>
  </div>

  <script src="/_magpie/bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
